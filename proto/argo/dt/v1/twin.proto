syntax = "proto3";

package argo.dt.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service DigitalTwin {
  // High-throughput data plane. Adapters reject records over 1 MiB, batches
  // over 4 MiB, or batches over 500 records before domain processing.
  rpc StreamTelemetry(stream TelemetryBatch) returns (stream IngestAck);

  // Ordered payload-minimized state notifications with cursor acks/heartbeats.
  rpc SubscribeState(stream StateStreamRequest) returns (stream StateStreamFrame);

  rpc GetState(GetStateRequest) returns (TwinState);
  rpc TraceLineage(LineageRequest) returns (LineageTrace);
  rpc DetectContradiction(DetectContradictionRequest) returns (EventAppendReceipt);
  rpc AdjudicateContradiction(AdjudicateContradictionRequest) returns (EventAppendReceipt);
  rpc RecordCorrection(RecordCorrectionRequest) returns (EventAppendReceipt);
  rpc PlanElicitation(ElicitationPlanRequest) returns (ElicitationPlan);
  rpc RecordElicitationResponse(RecordElicitationResponseRequest)
      returns (EventAppendReceipt);
  rpc CompileProjection(CompileProjectionRequest) returns (ProjectionResponse);
  rpc RevokeProjection(RevokeProjectionRequest) returns (ProjectionReceipt);

  rpc ForkSimulation(ForkSimulationRequest) returns (SimulationBranch);
  rpc AppendSimulation(AppendSimulationRequest) returns (SimulationBranch);
  rpc ProposeSimulationPromotion(PromotionRequest) returns (ReviewReferral);

  // Authorization is deliberately distinct from projection/data access.
  rpc CheckAction(CheckActionRequest) returns (PolicyDecision);
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
}

// The reference Python adapter implements StreamTelemetry, SubscribeState,
// and Health. Host packages bind the remaining control/query RPCs to their
// policy and identity infrastructure; unbound methods fail UNIMPLEMENTED.

message TelemetryBatch {
  string twin_id = 1;
  string subject_id = 2;
  string source = 3;
  string connector_version = 4;
  string idempotency_key = 5;
  int64 expected_sequence = 6;
  repeated TelemetryRecord records = 7;
}

message TelemetryRecord {
  string source_record_id = 1;
  google.protobuf.Timestamp valid_from = 2;
  google.protobuf.Timestamp valid_until = 3;
  string media_type = 4;
  bytes payload = 5;
  string content_hash = 6;
  string independence_group = 7;
  string sensitivity = 8;
  google.protobuf.Struct rights = 9;
}

message IngestAck {
  string twin_id = 1;
  string idempotency_key = 2;
  int64 first_sequence = 3;
  int64 last_sequence = 4;
  repeated string event_ids = 5;
  repeated RecordError errors = 6;
  string resume_token = 7;
  repeated TelemetryRecordAck record_acks = 8;
  int64 committed_sequence = 9;
  string stream_status = 10;
}

message RecordError {
  int32 record_index = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
}

message TelemetryRecordAck {
  int32 record_index = 1;
  string source_record_id = 2;
  // committed, duplicate, or rejected
  string status = 3;
  string event_id = 4;
  int64 sequence = 5;
  string error_code = 6;
  bool retryable = 7;
}

message StateSubscription {
  string twin_id = 1;
  // Trusted operations compatibility only. Public adapters require resume_token.
  int64 after_sequence = 2 [deprecated = true];
  repeated string event_types = 3;
  bool include_projection_events = 4;
  string resume_token = 5;
  int32 max_in_flight = 6;
}

message StateAcknowledge {
  string resume_token = 1;
}

message ClientHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

message ClientClose {
  int32 code = 1;
  string reason = 2;
}

message StateStreamRequest {
  oneof frame {
    StateSubscription subscribe = 1;
    StateAcknowledge acknowledge = 2;
    ClientHeartbeat heartbeat = 3;
    ClientClose close = 4;
  }
}

message StateChange {
  string schema_version = 1;
  string twin_id = 2;
  int64 sequence = 3;
  string event_type = 4;
  string plane = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp recorded_at = 7;
  string resume_token = 8;
}

message ServerHeartbeat {
  string twin_id = 1;
  int64 acknowledged_sequence = 2;
  string resume_token = 3;
  google.protobuf.Timestamp sent_at = 4;
}

message ServerClose {
  string twin_id = 1;
  int32 code = 2;
  string reason = 3;
  int64 acknowledged_sequence = 4;
  string resume_token = 5;
}

message StateStreamFrame {
  oneof frame {
    StateChange event = 1;
    ServerHeartbeat heartbeat = 2;
    ServerClose close = 3;
  }
}

// Internal canonical envelope used by simulation and trusted service adapters.
// It must never be emitted directly by a public state-notification endpoint.
message TwinEvent {
  string schema_version = 1;
  string event_id = 2;
  string twin_id = 3;
  int64 sequence = 4;
  string event_type = 5;
  string plane = 6;
  google.protobuf.Timestamp occurred_at = 7;
  google.protobuf.Timestamp recorded_at = 8;
  string producer = 9;
  string causation_id = 10;
  string correlation_id = 11;
  string previous_hash = 12;
  string event_hash = 13;
  google.protobuf.Struct payload = 14;
  string producer_role = 15;
}

message GetStateRequest {
  string twin_id = 1;
  google.protobuf.Timestamp as_of_valid_time = 2;
  google.protobuf.Timestamp as_of_recorded_time = 3;
  int64 up_to_sequence = 4;
}

message TwinState {
  string twin_id = 1;
  int64 sequence = 2;
  string event_hash = 3;
  repeated google.protobuf.Struct cells = 4;
  repeated string degraded_reasons = 5;
}

message LineageRequest {
  string twin_id = 1;
  string node_kind = 2;
  string node_id = 3;
  google.protobuf.Timestamp as_of_recorded_time = 4;
}

message LineageNode {
  string kind = 1;
  string node_id = 2;
}

message IndependenceGroup {
  string independence_group = 1;
  repeated string evidence_ids = 2;
}

message LineageTrace {
  string schema_version = 1;
  string twin_id = 2;
  LineageNode root = 3;
  repeated LineageNode ancestors = 4;
  repeated LineageNode dependents = 5;
  repeated IndependenceGroup evidence_groups = 6;
}

message DetectContradictionRequest {
  string twin_id = 1;
  repeated string claim_ids = 2;
  string basis = 3;
  int64 expected_sequence = 4;
  string idempotency_key = 5;
  google.protobuf.Timestamp detected_at = 6;
}

message AdjudicateContradictionRequest {
  string twin_id = 1;
  string contradiction_id = 2;
  string resolution = 3;
  repeated string preferred_claim_ids = 4;
  string rationale = 5;
  int64 expected_sequence = 6;
  string idempotency_key = 7;
  google.protobuf.Timestamp adjudicated_at = 8;
}

message RecordCorrectionRequest {
  string twin_id = 1;
  string target_kind = 2;
  string target_id = 3;
  string replacement_id = 4;
  string rationale = 5;
  int64 expected_sequence = 6;
  string idempotency_key = 7;
  google.protobuf.Timestamp corrected_at = 8;
}

message ElicitationGap {
  string gap_id = 1;
  string kind = 2;
  repeated string target_ids = 3;
  string rationale = 4;
}

message ElicitationQuestion {
  string question_id = 1;
  string gap_id = 2;
  string prompt = 3;
  string requested_relation = 4;
}

message ElicitationPlanRequest {
  string twin_id = 1;
  string objective = 2;
  repeated string claim_ids = 3;
}

message ElicitationPlan {
  string schema_version = 1;
  string plan_id = 2;
  string twin_id = 3;
  int64 source_sequence = 4;
  string objective = 5;
  repeated ElicitationGap gaps = 6;
  repeated ElicitationQuestion questions = 7;
  repeated string claim_ids = 8;
}

message ElicitationResponse {
  string response_id = 1;
  string question_id = 2;
  string answer = 3;
  string sensitivity = 4;
  google.protobuf.Timestamp answered_at = 5;
}

message RecordElicitationResponseRequest {
  string twin_id = 1;
  string subject_id = 2;
  ElicitationPlan plan = 3;
  ElicitationResponse response = 4;
  google.protobuf.Struct rights = 5;
  int64 expected_sequence = 6;
  string idempotency_key = 7;
}

message EventAppendReceipt {
  string event_id = 1;
  string twin_id = 2;
  int64 sequence = 3;
  string event_hash = 4;
}

message CompileProjectionRequest {
  string request_id = 1;
  string twin_id = 2;
  string subject_id = 3;
  string recipient_id = 4;
  string purpose = 5;
  repeated string requested_fields = 6;
  string maximum_sensitivity = 7;
  google.protobuf.Timestamp as_of_valid_time = 8;
  google.protobuf.Timestamp as_of_recorded_time = 9;
  int64 expected_sequence = 10;
  string idempotency_key = 11;
}

message ProjectionResponse {
  google.protobuf.Struct projection = 1;
  ProjectionReceipt receipt = 2;
}

message ProjectionReceipt {
  string projection_id = 1;
  string request_id = 2;
  string consent_id = 3;
  string policy_version = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  int64 source_sequence = 7;
  repeated string disclosed_fields = 8;
  string artifact_hash = 9;
}

message RevokeProjectionRequest {
  string twin_id = 1;
  string projection_id = 2;
  string reason = 3;
  int64 expected_sequence = 4;
  string idempotency_key = 5;
}

message ForkSimulationRequest {
  string twin_id = 1;
  int64 base_sequence = 2;
  string scenario = 3;
}

message AppendSimulationRequest {
  string branch_id = 1;
  string twin_id = 2;
  string event_type = 3;
  google.protobuf.Struct predicted_state = 4;
  string idempotency_key = 5;
}

message SimulationBranch {
  string branch_id = 1;
  string twin_id = 2;
  int64 base_sequence = 3;
  string scenario = 4;
  repeated TwinEvent events = 5;
  google.protobuf.Struct predicted_state = 6;
}

message PromotionRequest {
  string branch_id = 1;
  string twin_id = 2;
  string rationale = 3;
}

message ReviewReferral {
  string referral_id = 1;
  string status = 2;
  bool requires_human_review = 3;
}

message ActionEnvelope {
  string action_id = 1;
  string principal_id = 2;
  string actor_identity_id = 3;
  string purpose = 4;
  string target = 5;
  repeated string requested_capabilities = 6;
  string impact = 7;
  bool reversible = 8;
  repeated string evidence_ids = 9;
  string constraint_version = 10;
  string idempotency_key = 11;
  google.protobuf.Timestamp issued_at = 12;
  google.protobuf.Timestamp expires_at = 13;
}

message CheckActionRequest {
  ActionEnvelope action = 1;
}

message PolicyDecision {
  bool allowed = 1;
  repeated string reasons = 2;
  string policy_version = 3;
  string decision_id = 4;
}

message HealthResponse {
  string status = 1;
  string version = 2;
  int64 event_store_lag = 3;
  repeated string degraded_dependencies = 4;
}
