name: dt-ci

on:
  pull_request:
  push:
    branches: [main, "dt/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[contracts,bronze,dev,grpc]"
      - run: make grpc-generate
      - run: PYTHONPATH=src:build/grpc python -m unittest discover -s tests -v
      - run: make contracts
      - run: make lint
      - run: make typecheck
      - run: python -m compileall -q src tests scripts
      - run: PYTHONPATH=src python -m argo_dt.cli demo >/dev/null
      - run: >-
          PYTHONPATH=src python scripts/benchmark_epistemic.py
          --claims 1000 --iterations 10 --max-ancestor-p99-ms 250 --json
      - run: >-
          PYTHONPATH=src python scripts/soak_sync.py
          --duration-seconds 2 --events-per-second 50
          --max-p99-ms 1000 --minimum-throughput 25 --json
