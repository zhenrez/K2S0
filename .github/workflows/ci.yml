name: dt-ci

on:
  pull_request:
  push:
    branches: [main, "dt/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: make contracts
      - run: python -m compileall -q src tests scripts
      - run: PYTHONPATH=src python -m argo_dt.cli demo >/dev/null
