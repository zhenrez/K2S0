openapi: 3.1.0
info:
  title: ARGO Digital Twin Control API
  version: 1.0.0
  description: |
    Low-rate control and query surface. Use gRPC StreamTelemetry for
    high-volume telemetry and WebSocket /v1/twins/{twin_id}/events for
    browser-facing real-time deltas.
servers:
  - url: https://dt.internal.example
security:
  - oidc: [dt.read]
paths:
  /v1/twins/{twin_id}/state:
    get:
      operationId: getTwinState
      parameters:
        - $ref: "#/components/parameters/TwinId"
        - name: as_of_valid_time
          in: query
          schema: { type: string, format: date-time }
        - name: as_of_recorded_time
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Bitemporal state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinState" }
        "403": { $ref: "#/components/responses/Denied" }
  /v1/twins/{twin_id}/events:
    get:
      operationId: streamTwinStateChanges
      description: |
        WebSocket upgrade for payload-minimized state-change notifications.
        The first client frame is subscribe; keeping its optional cursor out of
        the URL prevents routine access-log capture. The cursor is a
        resumability capability, not an authentication token. Clients
        acknowledge only cursors received on this connection.
      security:
        - oidc: [dt.stream]
      parameters:
        - $ref: "#/components/parameters/TwinId"
      responses:
        "101":
          description: WebSocket protocol switched; frames follow StateStreamFrame.
        "400": { description: Invalid or expired cursor }
        "403": { $ref: "#/components/responses/Denied" }
      x-websocket:
        serverFrames:
          $ref: "#/components/schemas/StateStreamFrame"
        clientFrames:
          $ref: "#/components/schemas/StateStreamControlFrame"
        heartbeatSeconds: 30
  /v1/twins/{twin_id}/projections:
    post:
      operationId: compileProjection
      security:
        - oidc: [dt.project]
      parameters:
        - $ref: "#/components/parameters/TwinId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedSequence"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectionRequest" }
      responses:
        "201":
          description: Purpose-bound projection and disclosure-safe receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectionResponse" }
        "403": { $ref: "#/components/responses/Denied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/twins/{twin_id}/projections/{projection_id}/revoke:
    post:
      operationId: revokeProjection
      security:
        - oidc: [dt.project.revoke]
      parameters:
        - $ref: "#/components/parameters/TwinId"
        - name: projection_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedSequence"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectionRevocationRequest" }
      responses:
        "200":
          description: Revocation event appended; adapters invalidate dependent caches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventAppendReceipt" }
        "403": { $ref: "#/components/responses/Denied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/twins/{twin_id}/simulations:
    post:
      operationId: forkSimulation
      security:
        - oidc: [dt.simulate]
      parameters:
        - $ref: "#/components/parameters/TwinId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_sequence, scenario]
              properties:
                base_sequence: { type: integer, minimum: 0 }
                scenario: { type: string, minLength: 1 }
      responses:
        "201":
          description: Isolated simulation branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationBranch" }
  /v1/actions/check:
    post:
      operationId: checkAction
      security:
        - oidc: [dt.action.check]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionEnvelope" }
      responses:
        "200":
          description: Authority decision; no action is executed by this API
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDecision" }
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Process liveness only
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        "200": { description: Required dependencies healthy }
        "503": { description: One or more required dependencies degraded }
components:
  securitySchemes:
    oidc:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.internal.example/oauth/token
          scopes:
            dt.read: Read consent-scoped state
            dt.stream: Subscribe to subject-scoped state-change notifications
            dt.project: Compile projections
            dt.project.revoke: Revoke projections
            dt.simulate: Run isolated simulations
            dt.action.check: Evaluate action authority
  parameters:
    TwinId:
      name: twin_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    ExpectedSequence:
      name: If-Match-Sequence
      in: header
      required: true
      schema: { type: integer, minimum: 0 }
  schemas:
    StateChangeFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - schema_version
        - twin_id
        - sequence
        - event_type
        - plane
        - occurred_at
        - recorded_at
        - resume_token
      properties:
        type: { const: event }
        schema_version: { const: argo.dt.state-stream/v1 }
        twin_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 1 }
        event_type: { type: string, minLength: 1 }
        plane: { enum: [authoritative, projection] }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        resume_token: { type: string, minLength: 32, maxLength: 2048 }
    HeartbeatFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - schema_version
        - twin_id
        - acknowledged_sequence
        - resume_token
        - sent_at
      properties:
        type: { const: heartbeat }
        schema_version: { const: argo.dt.state-stream/v1 }
        twin_id: { type: string, minLength: 1 }
        acknowledged_sequence: { type: integer, minimum: 0 }
        resume_token: { type: string, minLength: 32, maxLength: 2048 }
        sent_at: { type: string, format: date-time }
    StreamCloseFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - schema_version
        - twin_id
        - code
        - reason
        - acknowledged_sequence
        - resume_token
      properties:
        type: { const: close }
        schema_version: { const: argo.dt.state-stream/v1 }
        twin_id: { type: string, minLength: 1 }
        code: { type: integer, minimum: 1000, maximum: 4999 }
        reason: { type: string, maxLength: 256 }
        acknowledged_sequence: { type: integer, minimum: 0 }
        resume_token: { type: string, minLength: 32, maxLength: 2048 }
    StateStreamFrame:
      oneOf:
        - $ref: "#/components/schemas/StateChangeFrame"
        - $ref: "#/components/schemas/HeartbeatFrame"
        - $ref: "#/components/schemas/StreamCloseFrame"
      discriminator: { propertyName: type }
    StateStreamControlFrame:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: subscribe }
            resume_token: { type: string, minLength: 32, maxLength: 2048 }
            max_in_flight: { type: integer, minimum: 1, maximum: 128, default: 128 }
            event_types:
              type: array
              uniqueItems: true
              maxItems: 64
              items: { type: string, minLength: 1, maxLength: 128 }
            include_projection_events: { type: boolean, default: false }
        - type: object
          additionalProperties: false
          required: [type, resume_token]
          properties:
            type: { const: acknowledge }
            resume_token: { type: string, minLength: 32, maxLength: 2048 }
        - type: object
          additionalProperties: false
          required: [type, sent_at]
          properties:
            type: { const: heartbeat }
            sent_at: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [type, code, reason]
          properties:
            type: { const: close }
            code: { type: integer, minimum: 1000, maximum: 4999 }
            reason: { type: string, maxLength: 256 }
    TwinState:
      type: object
      required:
        - twin_id
        - sequence
        - evidence
        - claims
        - accepted_claim_ids
        - contested_claim_ids
        - issued_projections
        - revoked_projection_ids
        - stale_claim_ids
        - degraded_reasons
      properties:
        twin_id: { type: string }
        subject_id: { type: [string, "null"] }
        sequence: { type: integer }
        evidence:
          type: object
          additionalProperties: { type: object }
        claims:
          type: object
          additionalProperties: { type: object }
        accepted_claim_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        contested_claim_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        issued_projections:
          type: object
          additionalProperties: { type: object }
        revoked_projection_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        stale_claim_ids:
          type: array
          uniqueItems: true
          items: { type: string }
        degraded_reasons:
          type: array
          items: { type: string }
    ProjectionRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - subject_id
        - recipient_id
        - purpose
        - requested_fields
        - maximum_sensitivity
        - as_of_valid_time
        - as_of_recorded_time
      properties:
        request_id: { type: string, format: uuid }
        subject_id: { type: string }
        recipient_id: { type: string }
        purpose: { type: string }
        requested_fields:
          type: array
          uniqueItems: true
          items:
            enum:
              - kernel
              - now
              - counterweights
              - voice
              - people
              - capabilities
              - decision_model
              - boundaries
              - history
              - readiness
        maximum_sensitivity:
          enum: [public, internal, confidential, restricted]
        as_of_valid_time: { type: string, format: date-time }
        as_of_recorded_time: { type: string, format: date-time }
    ProjectionResponse:
      type: object
      additionalProperties: false
      required: [projection, receipt]
      properties:
        projection:
          type: object
          description: Contains only fields compiled for this purpose and recipient.
        receipt:
          type: object
          required:
            - projection_id
            - consent_id
            - policy_version
            - source_sequence
            - artifact_hash
          properties:
            projection_id: { type: string, format: uuid }
            consent_id: { type: string }
            policy_version: { type: string }
            source_sequence: { type: integer }
            artifact_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    ProjectionRevocationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    EventAppendReceipt:
      type: object
      additionalProperties: false
      required: [event_id, twin_id, sequence, event_hash]
      properties:
        event_id: { type: string, format: uuid }
        twin_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 1 }
        event_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    SimulationBranch:
      type: object
      required:
        - branch_id
        - twin_id
        - base_sequence
        - scenario
        - predicted_state
      properties:
        branch_id: { type: string, format: uuid }
        twin_id: { type: string }
        base_sequence: { type: integer }
        scenario: { type: string }
        predicted_state: { type: object }
        requires_human_review: { const: true }
    ActionEnvelope:
      type: object
      required:
        - action_id
        - principal_id
        - actor_identity_id
        - purpose
        - target
        - requested_capabilities
        - impact
        - reversible
        - evidence_ids
        - constraint_version
        - idempotency_key
        - issued_at
        - expires_at
      properties:
        action_id: { type: string }
        principal_id: { type: string }
        actor_identity_id: { type: string }
        purpose: { type: string }
        target: { type: string }
        requested_capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
        impact: { enum: [none, low, moderate, high, critical] }
        reversible: { type: boolean }
        evidence_ids:
          type: array
          items: { type: string }
        constraint_version: { type: string }
        idempotency_key: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PolicyDecision:
      type: object
      required: [allowed, reasons, policy_version, decision_id]
      properties:
        allowed: { type: boolean }
        reasons:
          type: array
          items: { type: string }
        policy_version: { type: string }
        decision_id: { type: string }
  responses:
    Denied:
      description: Policy denied without disclosing excluded fields
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { const: Policy denied }
              status: { const: 403 }
              decision_id: { type: string }
    Conflict:
      description: Expected sequence is stale
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { const: Concurrency conflict }
              status: { const: 409 }
              current_sequence: { type: integer }
