[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-dt"
version = "0.5.0"
description = "K2S0 digital-twin reference kernel and integration contracts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSL-1.0" }
authors = [{ name = "ARGO Project" }]
dependencies = []

[project.urls]
Repository = "https://github.com/zhenrez/K2S0"
Issues = "https://github.com/zhenrez/K2S0/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]
contracts = ["PyYAML==6.0.2"]
bronze = ["cryptography==46.0.0"]
grpc = [
  "grpcio>=1.68,<2",
  "grpcio-tools>=1.68,<2",
  "protobuf>=5.29,<7",
]
nats = ["nats-py>=2.10,<3"]
otel = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]

[project.scripts]
argo-dt = "argo_dt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["argo_dt"]
